name: Cloudchillies.com.au Deploy to IONOS (SFTP)

on:
  push:
    branches: ["main"]   # change to "main" if your repo uses main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install SFTP Client
        run: sudo apt-get install -y lftp

      - name: Upload to IONOS via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          lftp -e "set sftp:auto-confirm yes; mirror -R ./ /; quit" \
          -u "$SFTP_USERNAME","$SFTP_PASSWORD" sftp://$SFTP_HOST
